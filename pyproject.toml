[project]
name = "switchboard"
version = "0.1.0"
description = "Recreate the darwin database"
readme = "README.md"
authors = [
    { name = "Lorenzo", email = "lorenzo@lrzodev.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "flask>=3.1.3",
    "halo>=0.0.31",
    "psycopg[binary,pool]>=3.3.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "toml>=0.10.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[project.scripts]
switchboard = "switchboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/switchboard",
]